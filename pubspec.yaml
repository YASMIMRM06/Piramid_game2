name: piramid_game
description: PiramidGame IFPR-Pgua – Ranking de Popularidade dos Alunos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Authentication + Firestore)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2

  # Armazenamento local (somente preferências: tema)
  shared_preferences: ^2.2.3

  # Navegação
  go_router: ^14.2.7

  # Estado reativo
  signals_flutter: ^5.5.0

  # Injeção de dependência
  auto_injector: ^1.0.1

  # Auxiliares
  equatable: ^2.0.5
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true